name: dbt build & docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-duckdb
        run: pip install "dbt-duckdb~=1.10.0"

      - name: dbt build on the committed sample (seed + run + test)
        run: |
          dbt build --target ci --vars '{"raw_dir": "data/sample"}'

      - name: dbt docs generate (static)
        run: |
          dbt docs generate --static --target ci --vars '{"raw_dir": "data/sample"}'

      - name: Stage docs site
        run: |
          mkdir -p _site
          cp target/static_index.html _site/index.html
          cp -r docs _site/figures || true

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
